# Cabeceras de seguridad, para incluir en cada bloque location.
#
# No basta con ponerlas una vez en el server: en nginx, un add_header dentro de
# un location DESCARTA todos los heredados de niveles superiores. Como casi
# todos nuestros location definen su propio Cache-Control, sin este include se
# quedarian sin cabeceras de seguridad justo donde mas hacen falta (index.html).

# Impide que el navegador adivine el tipo de contenido y ejecute como script
# algo que no lo es.
add_header X-Content-Type-Options nosniff always;

# La aplicacion no se embebe en iframes de otros sitios.
add_header X-Frame-Options SAMEORIGIN always;

# No filtrar la ruta completa al salir hacia otro dominio.
add_header Referrer-Policy strict-origin-when-cross-origin always;
