<div class="ag-page">

    <header class="ag-page__header">
        <div>
            <p class="ag-overline">Administracion</p>
            <h1 class="ag-page__title">Asignar roles</h1>
            <p class="ag-page__subtitle">Busca un usuario y marca los roles que debe tener.</p>
        </div>
    </header>

    <section class="ag-card asignacion">
        <form name="usuarioForm" class="asignacion__form">
            <div class="form__field">
                <label for="usuario">Usuario</label>
                <p-autoComplete inputId="usuario" name="usuario" [(ngModel)]="usuarioSeleccionado"
                    [suggestions]="filteredUsuarios" (completeMethod)="searchUsuarios($event)" field="username"
                    [minLength]="1" placeholder="Escribe para buscar un usuario"
                    (onSelect)="onUsuarioSelect($event)"></p-autoComplete>
            </div>

            <fieldset class="roles-field" *ngIf="usuarioSeleccionado.username; else sinUsuario">
                <legend>Roles de {{ usuarioSeleccionado.username }}</legend>
                <div class="roles-field__list">
                    <div class="role-check" *ngFor="let rol of roles">
                        <p-checkbox [inputId]="'rol_' + rol.id" [value]="rol.id" [binary]="true"
                            [(ngModel)]="rolesSeleccionados" [name]="'rol_' + rol.id"></p-checkbox>
                        <label [for]="'rol_' + rol.id">{{ rol.name }}</label>
                    </div>
                </div>
            </fieldset>

            <ng-template #sinUsuario>
                <p class="nota">Selecciona un usuario para ver y editar sus roles.</p>
            </ng-template>
        </form>
    </section>

    <section class="ag-card" aria-labelledby="titulo-asignados">
        <div class="ag-card__header">
            <h2 id="titulo-asignados" class="ag-card__title">Roles asignados</h2>
        </div>

        <div class="ag-table-wrap">
            <table class="ag-table">
                <thead>
                    <tr>
                        <th scope="col">Usuario</th>
                        <th scope="col">Roles</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of usuarioRolesMap | keyvalue">
                        <td data-label="Usuario">{{ item.key }}</td>
                        <td data-label="Roles">
                            <span class="ag-badge ag-badge--neutral" *ngFor="let nombre of item.value">
                                {{ nombre }}
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
