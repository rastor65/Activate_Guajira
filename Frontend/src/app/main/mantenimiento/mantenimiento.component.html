<main class="mantenimiento">
  <video class="mantenimiento__video" [src]="video" [poster]="construccion" autoplay muted loop playsinline
    aria-hidden="true"></video>

  <div class="mantenimiento__scrim" aria-hidden="true"></div>

  <section class="mantenimiento__panel">
    <span class="mantenimiento__icon"><i class="pi pi-wrench" aria-hidden="true"></i></span>

    <p class="mantenimiento__eyebrow">Activate Guajira</p>
    <h1 class="mantenimiento__title">Estamos en mantenimiento</h1>
    <p class="mantenimiento__text">
      Estamos aplicando mejoras a la plataforma. Vuelve en unos minutos:
      tus mediciones y tus planes siguen guardados.
    </p>
  </section>
</main>
