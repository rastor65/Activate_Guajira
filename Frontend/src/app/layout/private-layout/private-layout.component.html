<div class="shell" [class.shell--menu-open]="menuAbierto">

  <!-- ===================== BARRA LATERAL ===================== -->
  <aside class="shell__sidebar" *ngIf="isLoggedIn === true">
    <a class="shell__brand" [routerLink]="['/landing']">
      <img src="assets/peakfit.png" alt="">
      <span class="shell__brand-text">
        <strong>Activate</strong>
        <em>Guajira</em>
      </span>
    </a>

    <nav class="shell__nav" aria-label="Navegacion principal">
      <app-menu [menu]="menu1" (funcion)="ocultarMenu($event)"></app-menu>
    </nav>

    <div class="shell__sidebar-footer">
      <button pButton pRipple type="button" icon="pi pi-cog" class="p-button-text shell__icon-btn"
        (click)="menu.toggle($event)" aria-label="Ajustes de cuenta" pTooltip="Ajustes"></button>
      <p-menu #menu [popup]="true" [model]="items" appendTo="body"></p-menu>

      <button pButton pRipple type="button" icon="pi pi-sign-out" class="p-button-text shell__icon-btn"
        (click)="showConfirm()" aria-label="Cerrar sesion" pTooltip="Cerrar sesion"></button>
    </div>
  </aside>

  <!-- Velo para el cajon en movil: es accionable, asi que debe ser un boton -->
  <button type="button" class="shell__scrim" *ngIf="menuAbierto" (click)="cerrarMenu()"
    aria-label="Cerrar menu de navegacion"></button>

  <!-- ===================== CONTENIDO ===================== -->
  <div class="shell__main">
    <header class="shell__topbar">
      <button type="button" class="shell__burger" (click)="alternarMenu()"
        [attr.aria-expanded]="menuAbierto" aria-label="Abrir menu de navegacion">
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>

      <a class="shell__title" [routerLink]="['/landing']">Activate Guajira</a>

      <div class="shell__topbar-actions">
        <button type="button" class="shell__user" (click)="abrirEditarPerfil()" aria-label="Editar perfil">
          <img *ngIf="profileImage" [src]="profileImage" alt="" class="shell__avatar">
          <span class="shell__user-name" *ngIf="nombre">{{ nombre }}</span>
        </button>
      </div>
    </header>

    <main class="shell__content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>


<!-- ===================== CERRAR SESION ===================== -->
<p-dialog [(visible)]="Dialog" header="Cerrar sesion" [modal]="true" [resizable]="false" [draggable]="false"
  [style]="{ width: '26rem' }" [breakpoints]="{ '640px': '92vw' }">
  <div class="confirm">
    <span class="confirm__icon confirm__icon--warn"><i class="pi pi-sign-out" aria-hidden="true"></i></span>
    <p class="confirm__text">Vas a salir de tu cuenta. Tendras que volver a iniciar sesion para continuar.</p>
  </div>
  <ng-template pTemplate="footer">
    <button pButton pRipple type="button" label="Cancelar" class="p-button-text" (click)="hideDialog()"></button>
    <button pButton pRipple type="button" label="Cerrar sesion" icon="pi pi-check"
      (click)="cerrarSesion()"></button>
  </ng-template>
</p-dialog>


<!-- ===================== CAMBIAR CONTRASENA ===================== -->
<p-dialog [(visible)]="DialogContra" header="Cambiar contrasena" [modal]="true" [resizable]="false" [draggable]="false"
  [style]="{ width: '28rem' }" [breakpoints]="{ '640px': '92vw' }">
  <form (ngSubmit)="cambiarContrasena()" [formGroup]="formCambioContrasena" class="form">
    <div class="form__field">
      <label for="contrasenaActual">Contrasena actual</label>
      <input id="contrasenaActual" type="password" formControlName="contrasenaActual" pInputText
        autocomplete="current-password" required>
    </div>
    <div class="form__field">
      <label for="nuevaContrasena">Nueva contrasena</label>
      <input id="nuevaContrasena" type="password" formControlName="nuevaContrasena" pInputText
        autocomplete="new-password" required>
    </div>
    <div class="form__field">
      <label for="confirmarContrasena">Confirmar contrasena</label>
      <input id="confirmarContrasena" type="password" formControlName="confirmarContrasena" pInputText
        autocomplete="new-password" required>
    </div>
    <div class="form__actions">
      <button pButton pRipple type="button" label="Cancelar" class="p-button-text"
        (click)="cerrarEditarContra()"></button>
      <button pButton pRipple type="submit" label="Guardar" icon="pi pi-check"></button>
    </div>
  </form>
</p-dialog>


<!-- ===================== EDITAR PERFIL ===================== -->
<p-dialog [(visible)]="Dialog2" header="Editar perfil" [modal]="true" [resizable]="false" [draggable]="false"
  [style]="{ width: '64rem' }" [breakpoints]="{ '1024px': '92vw' }">

  <p-progressBar *ngIf="cargandopersona" mode="indeterminate" [style]="{ height: '4px' }"
    aria-label="Cargando datos"></p-progressBar>

  <p class="dialog__lede" *ngIf="usuario">
    Actualiza los datos de <strong>{{ usuario.nombres }} {{ usuario.apellidos }}</strong>.
  </p>

  <div class="form-grid">

    <fieldset class="form-section">
      <legend>Identificacion</legend>
      <div class="form__field">
        <label for="document_type">Tipo de documento</label>
        <p-select id="document_type" [options]="documentTypes" optionLabel="nombre" optionValue="id"
          [(ngModel)]="usuario.document_type" placeholder="Selecciona un tipo" [filter]="true"
          appendTo="body"></p-select>
      </div>
      <div class="form__field">
        <label for="identificacion">Numero de documento</label>
        <input type="text" id="identificacion" placeholder="Numero de documento" pInputText
          [(ngModel)]="usuario.identificacion">
      </div>
      <div class="form__field">
        <label for="fecha_nacimiento">Fecha de nacimiento</label>
        <p-datePicker id="fecha_nacimiento" [(ngModel)]="usuario.fecha_nacimiento" dateFormat="yy-mm-dd"
          (onSelect)="formatFechaNacimiento()" placeholder="Selecciona la fecha" [showIcon]="true"
          appendTo="body"></p-datePicker>
      </div>
      <div class="form__field">
        <label for="edad">Edad</label>
        <input [readOnly]="true" type="text" placeholder="Edad" id="edad" pInputText [(ngModel)]="usuario.edad">
      </div>
    </fieldset>

    <fieldset class="form-section">
      <legend>Perfil socioeconomico</legend>
      <div class="form__field">
        <label for="nivelFormacion">Nivel de formacion</label>
        <p-select id="nivelFormacion" [options]="niveles_formacion" optionLabel="nombre" optionValue="id"
          [(ngModel)]="usuario.nivelFormacion" placeholder="Nivel de formacion" [filter]="true"
          appendTo="body"></p-select>
      </div>
      <div class="form__field">
        <label for="estrato">Estrato</label>
        <p-select id="estrato" [options]="estrato" optionLabel="nombre" optionValue="id" [(ngModel)]="usuario.estrato"
          placeholder="Estrato" [filter]="true" appendTo="body"></p-select>
      </div>
      <div class="form__field">
        <label for="situacion_laboral">Situacion laboral</label>
        <p-select id="situacion_laboral" [options]="situacionLaboral" optionLabel="nombre" optionValue="id"
          [(ngModel)]="usuario.situacion_laboral" placeholder="Situacion laboral" [filter]="true"
          appendTo="body"></p-select>
      </div>
    </fieldset>

    <fieldset class="form-section">
      <legend>Residencia</legend>
      <div class="form__field">
        <label for="departamento">Departamento</label>
        <p-select id="departamento" [options]="departamento" optionLabel="nombre" optionValue="id"
          [(ngModel)]="usuario.departamento" placeholder="Departamento" [filter]="true" appendTo="body"></p-select>
      </div>
      <div class="form__field">
        <label for="ciudad_residencia">Ciudad de residencia</label>
        <p-select id="ciudad_residencia" [options]="ciudad" optionLabel="nombre" optionValue="id"
          [(ngModel)]="usuario.ciudad_residencia" placeholder="Ciudad de residencia" [filter]="true"
          appendTo="body"></p-select>
      </div>
      <div class="form__field">
        <label for="barrio">Barrio</label>
        <p-select id="barrio" [options]="barrio" optionLabel="nombre" optionValue="id" [(ngModel)]="usuario.barrio"
          placeholder="Barrio de residencia" [filter]="true" appendTo="body"></p-select>
      </div>
      <div class="form__field">
        <label for="telefono">Telefono</label>
        <input type="text" id="telefono" placeholder="Telefono" pInputText [(ngModel)]="usuario.telefono">
      </div>
    </fieldset>

    <fieldset class="form-section">
      <legend>Datos demograficos</legend>
      <div class="form__field">
        <label for="ciudad_nacimiento">Ciudad de nacimiento</label>
        <p-select id="ciudad_nacimiento" [options]="ciudad" optionLabel="nombre" optionValue="id"
          [(ngModel)]="usuario.ciudad_nacimiento" placeholder="Ciudad de nacimiento" [filter]="true"
          appendTo="body"></p-select>
      </div>
      <div class="form__field">
        <label for="estado_civil">Estado civil</label>
        <p-select id="estado_civil" [options]="estadoCivil" optionLabel="nombre" optionValue="id"
          [(ngModel)]="usuario.estado_civil" placeholder="Estado civil" [filter]="true" appendTo="body"></p-select>
      </div>
      <div class="form__field">
        <label for="grupoEtnico">Grupo etnico</label>
        <p-select id="grupoEtnico" [options]="grupoEtnico" optionLabel="nombre" optionValue="id"
          [(ngModel)]="usuario.grupoEtnico" placeholder="Grupo etnico" [filter]="true" appendTo="body"></p-select>
      </div>
      <div class="form__field">
        <label for="genero">Genero</label>
        <p-select id="genero" [options]="genero" optionLabel="nombre" optionValue="id" [(ngModel)]="usuario.genero"
          placeholder="Genero" [filter]="true" appendTo="body"></p-select>
      </div>
    </fieldset>
  </div>

  <label class="consent" for="consentimiento-perfil">
    <input type="checkbox" id="consentimiento-perfil" required [(ngModel)]="user.consentimiento">
    <span>
      He leido y acepto el
      <a href="assets/Consentimiento_informado.pdf" target="_blank" rel="noopener noreferrer">
        consentimiento informado</a>.
    </span>
  </label>

  <ng-template pTemplate="footer">
    <button pButton pRipple type="button" label="Cancelar" class="p-button-text" (click)="cerrarEditarPerfil()"
      [disabled]="botonesDesactivados"></button>
    <button pButton pRipple type="button" label="Guardar cambios" (click)="guardarDatos()"
      [disabled]="botonesDesactivados" [icon]="isGuardando ? 'pi pi-spin pi-spinner' : 'pi pi-check'"></button>
  </ng-template>
</p-dialog>


<!-- ===================== IMAGEN DE PERFIL ===================== -->
<p-dialog [(visible)]="displayDialog2" header="Imagen de perfil" [modal]="true" [resizable]="false" [draggable]="false"
  [style]="{ width: '28rem' }" [breakpoints]="{ '640px': '92vw' }">
  <form (ngSubmit)="guardarImagenPerfil()" class="form">
    <div class="avatar-preview">
      <img [src]="profileImage" alt="Vista previa de tu imagen de perfil">
    </div>

    <label class="file-drop" for="newImage">
      <i class="pi pi-upload" aria-hidden="true"></i>
      <span>Seleccionar una imagen</span>
      <input type="file" id="newImage" (change)="onFileSelected($event)" accept="image/*">
    </label>

    <div class="form__actions">
      <button pButton pRipple type="button" label="Cancelar" class="p-button-text"
        (click)="cerrarEditarImagen()"></button>
      <button pButton pRipple type="submit" label="Guardar" icon="pi pi-check"></button>
    </div>
  </form>
</p-dialog>
